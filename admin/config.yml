backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: "https://dima-kudryashov.netlify.app"

collections:
  - name: "content"
    label: "Website Content"
    files:
      - file: "content/home.md"
        label: "Homepage"
        name: "homepage"
        fields:

          - label: "Artist Name"
            name: "name"
            widget: "string"

          - label: "Subtitle"
            name: "subtitle"
            widget: "string"

          - label: "About"
            name: "about"
            widget: "text"

          - label: "School"
            name: "school"
            widget: "string"

          - label: "School Role"
            name: "school_role"
            widget: "string"

          - label: "School Description"
            name: "school_description"
            widget: "text"

          - label: "Profile Photo"
            name: "profile_photo"
            widget: "image"
            required: false

          - label: "Music"
            name: "music"
            widget: "list"
            fields:

              - label: "Track Name"
                name: "title"
                widget: "string"

              - label: "Audio File"
                name: "audio"
                widget: "file"
                required: false

              - label: "Link"
                name: "link"
                widget: "string"
                required: false
