backend:
  name: github
  repo: Vex_BPM/dima-kudryashov.github.io
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: "https://vex_bpm.github.io"

collections:

  - name: "content"
    label: "Website Content"
    files:

      - file: "content/home.md"
        label: "Homepage"
        name: "homepage"

        fields:

          - label: "Artist Name"
            name: "name"
            widget: "string"
            default: "Dima Kudryashov"

          - label: "Subtitle"
            name: "subtitle"
            widget: "string"
            default: "Music Producer · Sound Designer"

          - label: "About"
            name: "about"
            widget: "text"

          - label: "School"
            name: "school"
            widget: "string"
            default: "Verden Campus"

          - label: "School Role"
            name: "school_role"
            widget: "string"
            default: "Student · Music Technology · Technik-Team"

          - label: "School Description"
            name: "school_description"
            widget: "text"

          - label: "Profile Photo"
            name: "profile_photo"
            widget: "image"
            required: false

          - label: "Music"
            name: "music"
            widget: "list"

            fields:

              - label: "Track Name"
                name: "title"
                widget: "string"

              - label: "Audio File"
                name: "audio"
                widget: "file"
                required: false

              - label: "Link"
                name: "link"
                widget: "string"
                required: false
